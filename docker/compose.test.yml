# Serveur IMAP/SMTP de test pour les tests d'intégration : npm run test:integration
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=dali:secret@example.com -Dgreenmail.verbose=false
    ports:
      - "3143:3143"
      - "3025:3025"
