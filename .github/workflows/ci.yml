name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=dali:secret@example.com -Dgreenmail.verbose=false
        ports:
          - 3143:3143
          - 3025:3025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Attente de GreenMail
        run: for i in $(seq 1 30); do nc -z 127.0.0.1 3143 && break; sleep 2; done
      - run: npm run test:integration
      - run: docker build -t omnimail-mcp:ci .
