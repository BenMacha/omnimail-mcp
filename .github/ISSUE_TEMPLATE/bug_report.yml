name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour. Never paste passwords or real e-mail content.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: omnimail version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      options: [iCloud, Gmail, Yahoo / AOL, Infomaniak, Proton (Bridge), Outlook / Microsoft 365, Other IMAP]
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options: [Claude Code, Claude Desktop, Claude.ai, ChatGPT, Perplexity, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `omnimail accounts test` or the error returned by the tool (redact addresses).
      render: text
